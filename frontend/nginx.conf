server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable — cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: client-side routes (/portal, /admin, /track…) must serve
  # index.html rather than 404 on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
